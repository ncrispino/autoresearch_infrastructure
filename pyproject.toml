[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-infrastructure"
version = "0.1.0"
description = "Optimization experiments with LLM researchers: saved candidates, checked validity, measured results"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]
test = ["pytest>=9,<10", "ruff>=0.15"]

[project.scripts]
ari = "autoresearch_infrastructure.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch_infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
