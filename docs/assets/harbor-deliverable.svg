<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="744" viewBox="0 0 1152 744" role="img" aria-labelledby="title description">
  <title id="title">A Harbor task as an ARI task: the files you set up and where each one is used</title>
  <desc id="description">On the left, the task directory: task.py, run.toml, seed/ and an unchanged Harbor task directory holding instruction.md, task.toml, environment/, tests/ with feedback.sh and test.sh, and solution/. On the right, what runs. The researcher is a Harbor agent in a container built from environment/ alone; it edits /workspace/candidate/, which starts as seed/, and reads instruction.md and your rules as its objective. It submits with record_candidate to the ARI controller, which saves the candidate, has the reviewer judge each rule, and starts the grader. The grader is a new container for every submission, started by ARI and not by Harbor's verifier; the saved candidate is mounted read-only at the deliverable path and tests/ at /tests. The feedback script's reward goes back to the researcher and ranks candidates. The sealed script's reward goes only to private evidence. task.py names what a Harbor task leaves out: the deliverable path, the two scripts and the rules.</desc>
  <style>
    :root { --bg: #f5f7fa; --panel: #fff; --ink: #172a40; --muted: #52677e; --line: #cfd8e3; --accent: #275ed2; --tint: #eaf0ff; --code: #e9eef4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: var(--color-canvas-default, #101a29); --panel: var(--color-canvas-subtle, #18263a); --ink: var(--color-fg-default, #edf3ff); --muted: var(--color-fg-muted, #b3c2d8); --line: var(--color-border-default, #3c506c); --accent: #90b3ff; --tint: #243b63; --code: #293b52; }
    }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: var(--muted); }
    .heading { font-size: 19px; font-weight: 650; }
    .label { font-size: 14.5px; font-weight: 650; }
    .note { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 400; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .guide { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 6 3-6 3" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1152" height="744" rx="18" fill="var(--bg)"/>

  <!-- The files you set up -->
  <g>
    <rect x="32" y="32" width="400" height="372" rx="12" class="panel"/>
    <text x="52" y="62" class="eyebrow">THE FILES YOU SET UP</text>
    <text x="52" y="84" class="mono" font-weight="650">my-task/</text>
    <path d="M57 92V364M75 256V276M75 304V348" class="guide"/>
    <text class="mono">
      <tspan x="70" y="104">task.py</tspan><tspan x="236" class="note">what Harbor leaves out</tspan>
      <tspan x="70" y="128">run.toml</tspan><tspan x="236" class="note">the agents and the budget</tspan>
      <tspan x="70" y="152">seed/</tspan><tspan x="236" class="note">the starting deliverable</tspan>
      <tspan x="70" y="176">harbor-task/</tspan><tspan x="236" class="note">a Harbor task, unchanged</tspan>
      <tspan x="88" y="200">instruction.md</tspan><tspan x="236" class="note">the written objective</tspan>
      <tspan x="88" y="224">task.toml</tspan><tspan x="236" class="note">resources and time limits</tspan>
      <tspan x="88" y="248">environment/</tspan><tspan x="236" class="note">the researcher's image</tspan>
      <tspan x="106" y="272">Dockerfile</tspan>
      <tspan x="88" y="296">tests/</tspan><tspan x="236" class="note">the grader</tspan>
      <tspan x="106" y="320">feedback.sh</tspan><tspan x="236" class="note">the score that is shown</tspan>
      <tspan x="106" y="344">test.sh</tspan><tspan x="236" class="note">the score that is sealed</tspan>
      <tspan x="88" y="368">solution/</tspan><tspan x="236" class="note">not used</tspan>
    </text>
  </g>

  <!-- task.py -->
  <g>
    <rect x="32" y="440" width="400" height="272" rx="12" class="panel"/>
    <text x="52" y="470" class="eyebrow">WHAT A HARBOR TASK LEAVES OUT</text>
    <text x="52" y="497" class="heading mono" font-size="19">task.py</text>
    <rect x="52" y="512" width="360" height="154" rx="7" fill="var(--code)"/>
    <text class="code">
      <tspan x="66" y="535">ari.bases.harbor_deliverable(</tspan>
      <tspan x="98" y="554">run, harbor_task="harbor-task",</tspan>
      <tspan x="98" y="573">deliverable="/app/output",</tspan>
      <tspan x="98" y="592">feedback="/tests/feedback.sh",</tspan>
      <tspan x="98" y="611">sealed="/tests/test.sh",</tspan>
      <tspan x="98" y="630">rules=["...", "..."],</tspan>
      <tspan x="66" y="649">)</tspan>
    </text>
    <text x="52" y="692" class="note">A Harbor task has one test script and no list of rules.</text>
  </g>

  <!-- From the files to what runs -->
  <path d="M432 147H510" class="arrow"/>
  <path d="M432 195H510" class="arrow"/>
  <path d="M432 243H510" class="arrow"/>
  <path d="M432 291H472V577H510" class="arrow"/>

  <!-- The researcher -->
  <g>
    <rect x="512" y="32" width="576" height="268" rx="12" class="panel"/>
    <text x="532" y="62" class="eyebrow">RESEARCHER'S CONTAINER</text>
    <text x="532" y="89" class="heading">A Harbor agent, working in the task's own image</text>
    <text x="532" y="111" class="note">Harbor starts it and installs the agent. ARI adds the mounts and the submit tool.</text>
    <path d="M532 126H1068" class="guide"/>
    <text class="mono">
      <tspan x="532" y="152">/workspace/candidate/</tspan><tspan x="724" class="note">the deliverable it edits; starts as seed/</tspan>
    </text>
    <text x="532" y="200" class="label">Objective</text>
    <text x="724" y="200" class="note">instruction.md, then the rules from task.py</text>
    <text x="532" y="248" class="label">Image</text>
    <text x="724" y="248" class="note">built from environment/ alone, without the grader</text>
    <text x="724" y="268" class="note">or the task's compose services</text>
  </g>

  <path d="M800 300V334" class="arrow"/>
  <text x="814" y="322" class="note">submits with <tspan class="code" fill="var(--ink)">record_candidate</tspan></text>

  <!-- The controller -->
  <g>
    <rect x="512" y="336" width="576" height="68" rx="12" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="532" y="362" class="eyebrow">ARI CONTROLLER, ON THE HOST</text>
    <text x="532" y="386" class="label">Saves the candidate, has the reviewer judge each rule, then starts the grader</text>
  </g>

  <path d="M800 404V438" class="arrow"/>
  <text x="814" y="426" class="note">each valid candidate</text>

  <!-- The grader -->
  <g>
    <rect x="512" y="440" width="576" height="272" rx="12" class="panel"/>
    <text x="532" y="470" class="eyebrow">GRADER CONTAINER</text>
    <text x="532" y="497" class="heading">The task's own grader, new for every submission</text>
    <text x="532" y="519" class="note">Started by ARI, not by Harbor's verifier, which runs only once, after the agent stops.</text>
    <rect x="532" y="534" width="536" height="60" rx="7" fill="var(--code)"/>
    <text class="mono">
      <tspan x="546" y="558">/app/output</tspan><tspan x="724" class="note">the saved candidate, read-only</tspan>
      <tspan x="546" y="582">/tests</tspan><tspan x="724" class="note">tests/ of the Harbor task, read-only</tspan>
    </text>

    <rect x="532" y="608" width="260" height="84" rx="10" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="548" y="632" class="eyebrow">SEALED SCRIPT</text>
    <text x="548" y="655" class="mono">test.sh → reward</text>
    <text x="548" y="676" class="note">private; printed by <tspan class="code" fill="var(--ink)">ari sealed</tspan></text>

    <rect x="808" y="608" width="260" height="84" rx="10" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="824" y="632" class="eyebrow">FEEDBACK SCRIPT</text>
    <text x="824" y="655" class="mono">feedback.sh → reward</text>
    <text x="824" y="676" class="note">ranks candidates</text>
  </g>

  <!-- The feedback score returns to the researcher -->
  <path d="M1068 650H1108V147H1090" class="arrow"/>
  <text transform="translate(1132 400) rotate(-90)" text-anchor="middle" class="note">feedback score, after each submission</text>
</svg>
