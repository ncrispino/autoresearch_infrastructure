# No agents: grade your own edits with ari record.
reviewer = false

[limits]
candidates = 4
evaluations = 4

# [task]
# cpus = 4                      # only on a machine with fewer than the task's 8 CPUs; scores will differ
# grader_image = "sha256:..."   # a grader image already built from environment/are-grader-ctx
# image = "sha256:..."          # the task's main image, already built; the seed is checked against it
