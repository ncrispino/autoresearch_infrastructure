revision = "4f398de8aacaf392d6ff63da1f3977075c9738b1"
version = "1.0.0"
screen_task_ids = ["bigcodebench_13", "bigcodebench_15"]
confirmation_task_ids = ["bigcodebench_17", "bigcodebench_19", "bigcodebench_34", "bigcodebench_37"]
