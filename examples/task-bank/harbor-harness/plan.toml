[screen]
cases = 2
repeats = 1
candidates_including_baseline = 4
max_solver_trial_starts = 8

[confirmation]
cases = 4
repeats = 2
candidates_including_baseline = 2
max_solver_trial_starts = 16

[benchmark]
name = "bigcodebench-hard-complete"
source_adapter = "https://github.com/harbor-framework/harbor/tree/main/adapters/bigcodebench_hard"
